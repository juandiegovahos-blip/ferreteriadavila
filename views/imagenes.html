<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/styles.css">

    <title>Galería - Ferretería Dávila</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .foto {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s;
        }

        .foto:hover {
            transform: scale(1.03);
        }

        .foto img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .foto h3 {
            margin: 0;
            padding: 15px;
        }
    </style>

</head>

<body>

    <!-- MENÚ -->

    <nav>

        <div class="logo">

            <img src="../assets/fotos/sin_fondo.png"
                 width="40"
                 height="40"
                 alt="logo">

        </div>

        <ul>

            <li>
                <a href="../index.html" id="active2">
                    inicio
                </a>
            </li>

            <li>
                <a href="./presupuesto.html" id="active3">
                    presupuesto
                </a>
            </li>

            <li>
                <a href="./imagenes.html" id="active">
                    galeria
                </a>
            </li>

            <li>
                <a href="./contacto.html" id="active4">
                    contacto
                </a>
            </li>

        </ul>

    </nav>


    <!-- GALERÍA -->

    <main>

        <h1 style="text-align: center; margin-top: 40px;">
            Galería de Ferretería Dávila
        </h1>

        <div class="galeria" id="galeria">

            <!-- Las fotos aparecerán aquí automáticamente -->

        </div>

    </main>


    <!-- PIE DE PÁGINA -->

    <footer>

        <p>Santa Ursula, Carretera provincial 34</p>

        <br>

        <a href="www.facebook.com">
            <img src="../assets/fotos/facebook.png"
                 width="100"
                 height="100"
                 alt="facebook">
        </a>

        <a href="www.instagram.com">
            <img src="../assets/fotos/instagram.png"
                 width="100"
                 height="100"
                 alt="instagram">
        </a>

        <a href="www.youtube.com">
            <img src="../assets/fotos/youtube.png"
                 width="100"
                 height="100"
                 alt="youtube">
        </a>

        <br>

        <p>922 30 29 40</p>

        <br>

        <p>Todos los derechos reservados</p>

    </footer>


    <!-- JAVASCRIPT / JQUERY -->

    <script>

        $(document).ready(function () {

            $.getJSON("galeria.json", function (fotos) {

                $.each(fotos, function (index, foto) {

                    $("#galeria").append(

                        '<div class="foto">' +

                            '<img src="' + foto.imagen + '" ' +
                            'alt="' + foto.titulo + '">' +

                            '<h3>' +
                            foto.titulo +
                            '</h3>' +

                        '</div>'

                    );

                });

            }).fail(function () {

                $("#galeria").html(
                    "<p>No se pudo cargar la galería.</p>"
                );

            });

        });

    </script>
<!-- VISOR DE FOTOS -->

<div id="visor">
    <span id="cerrar">&times;</span>
    <img id="imagen-grande" src="" alt="">
</div>

<style>

#visor {
    display: none;
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    justify-content: center;
    align-items: center;
}

#imagen-grande {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
}

#cerrar {
    position: absolute;
    top: 20px;
    right: 35px;
    color: white;
    font-size: 50px;
    cursor: pointer;
}

</style>

<script>

$(document).on("click", ".foto img", function() {

    let imagen = $(this).attr("src");

    $("#imagen-grande").attr("src", imagen);

    $("#visor").css("display", "flex");

});

$("#cerrar").click(function() {

    $("#visor").hide();

});

$("#visor").click(function(e) {

    if (e.target === this) {
        $("#visor").hide();
    }

});

</script>
</body>

</html>
